name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 12 * * *'

jobs:
  build:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Use Node.js 21
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: 'npm'
      - run: npm install
      - run: npm test
