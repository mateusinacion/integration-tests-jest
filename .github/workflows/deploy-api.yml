name: Deploy API

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx tsc -p .

      - name: Ensure D1 database exists and inject its id
        run: |
          set -euo pipefail
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "got-db") | .uuid')
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create got-db
            DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "got-db") | .uuid')
          fi
          echo "D1 got-db id: $DB_ID"
          sed -i "s/REPLACE_AFTER_D1_CREATE/$DB_ID/" wrangler.jsonc

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply got-db --remote

      - name: Deploy Worker
        run: npx wrangler deploy
